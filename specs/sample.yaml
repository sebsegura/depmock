openapi: 3.0.0
x-json-schema-faker:
  use-example-values: true
  useExamplesValue: true
  fillProperties: false
info:
  title: Payment API
  description: API for handling authentication and payments
  version: 1.0.0

paths:
  /auth/login:
    post:
      summary: User authentication
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: "user@example.com"
                password:
                  type: string
                  example: "password123"
              required:
                - username
                - password
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
        "400":
          description: Invalid username or password
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid username or password"

  /payments:
    post:
      summary: Make a payment
      description: Processes a payment. Requires authorization.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  example: "100.00"
                currency:
                  type: string
                  example: "USD"
                url:
                  type: string
                  format: uri
              required:
                - amount
                - currency
                - url
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          example: "Bearer your-jwt-token-here"
      responses:
        "201":
          description: Payment processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "pay_1234567890abcdef"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid amount or currency"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authorization token"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "An unexpected error occurred"
      callbacks:
        payment-notification:
          "{$request.body#/url}":
            post:
              summary: Payment status notification
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        id:
                          type: string
                          example: "pay_123456790abcdef"
                          x-prism:
                            value: "{$response.body#/id}"
                        status:
                          type: string
                          enum: [APPROVED, REJECTED]

              responses:
                "200":
                  description: "Notification successfully processed"

    get:
      summary: List all payments
      description: Returns a list of all processed payments. Requires authorization.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          example: "Bearer your-jwt-token-here"
      responses:
        "200":
          description: A list of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "pay_1234567890abcdef"
                    amount:
                      type: string
                      example: "100.00"
                    currency:
                      type: string
                      example: "USD"
                    status:
                      type: string
                      example: "completed"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid or missing authorization token"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "An unexpected error occurred"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
